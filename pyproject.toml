[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "lanthanide-separation"
version = "0.1.0"
description = "Leakage-safe all-pairs lanthanide separation models with paired 3D features"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26",
  "pandas>=2.2",
  "pyarrow>=15",
  "scikit-learn>=1.5",
  "scipy>=1.11",
  "joblib>=1.4",
]

[project.optional-dependencies]
deep = [
  "torch>=2.2",
]
gen3 = [
  "torch>=2.2",
  "catboost>=1.2.8,<2",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
markers = [
  "slow: needs the built cohort or a completed run artefact on disk",
]
