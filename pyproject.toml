[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "lanthanide-separation"
version = "0.1.0"
description = "Leakage-safe adjacent-lanthanide separation models with paired 3D features"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26",
  "pandas>=2.2",
  "pyarrow>=15",
  "scikit-learn>=1.5",
  "joblib>=1.4",
]

[project.optional-dependencies]
deep = [
  "torch>=2.2",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
